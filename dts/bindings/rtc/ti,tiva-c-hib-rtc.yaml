# SPDX-License-Identifier: Apache-2.0

description: TI Tiva C Hibernation RTC

compatible: "ti,tiva-c-hib-rtc"

include: [rtc-device.yaml, base.yaml]

properties:
  reg:
    required: true

  interrupts:
    required: true

  clock-frequency:
    type: int
    required: true
    description: |
      Clock frequency fed to the Hibernation module.  Typically 32768 Hz
      from an external low-frequency crystal.
